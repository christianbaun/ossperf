name: S3 Ninja and OSSPerf Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  run-workflow:
    runs-on: self-hosted

    env:
      S3_ACCESS_KEY: ${{ secrets.S3NINJA_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3NINJA_SECRET_KEY }}
      S3_ENDPOINT: "http://localhost:9444/s3" # S3Ninja's default endpoint

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3


    - name: Remove Existing S3ninja Container
      run: |
        if [ $(docker ps -aq -f name=s3ninja) ]; then
         docker stop s3ninja
         docker rm s3ninja
        fi     
        sleep 5
    - name: Start S3 Ninja Server
      run: |
        docker run -d --name s3ninja \
          -p 9444:9000 \
          -e AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY \
          -e AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY \
          scireum/s3-ninja:6.1
        docker logs s3ninja     
    - name: Wait for S3 Ninja Server to Start
      run: |
        for i in {1..10}; do
          if curl -s $S3_ENDPOINT; then
            echo "S3Ninja is ready!";
            break;
          fi
          echo "Waiting for S3Ninja to start...";
          sleep 5;
        done
        
    - name: Configure s3cmd
      run: |
        s3cmd --configure --access_key=$S3_ACCESS_KEY --secret_key=$S3_SECRET_KEY --host=$S3_ENDPOINT --host-bucket="%(bucket)s.localhost:9444" --no-check-certificate

    - name: Run ossperf.sh
      run: |
        cd $GITHUB_WORKSPACE
        chmod +x ossperf.sh
        ./ossperf.sh -n 10 -s 5000 -u -p -o 2>&1
#        ./ossperf.sh -n 10 -s 5000 -u -p   
